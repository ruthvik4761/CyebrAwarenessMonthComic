<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alter Domus Cybersecurity Grand Prix</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="track"><div id="track-fill"></div><div id="track-car"><svg viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="32" cy="27" rx="26" ry="3" fill="#000" opacity="0.35"/>
  <path d="M6 20 L10 11 Q14 6 22 6 L40 6 Q47 6 51 11 L58 20 Z" fill="#ff0000" stroke="#0d0d0f" stroke-width="1.5"/>
  <path d="M18 11 L24 8 L38 8 L44 11 Z" fill="#00e5ff" opacity="0.85"/>
  <rect x="4" y="18" width="56" height="5" rx="2.5" fill="#0d0d0f"/>
  <circle cx="16" cy="24" r="6" fill="#0d0d0f"/>
  <circle cx="16" cy="24" r="2.5" fill="#c9cdd3"/>
  <circle cx="48" cy="24" r="6" fill="#0d0d0f"/>
  <circle cx="48" cy="24" r="2.5" fill="#c9cdd3"/>
</svg></div></div>

<button id="mute-btn" title="Toggle music">🔊</button>

<audio id="bgm" loop preload="auto">
  <source src="assets/audio/bgm.mp3" type="audio/mpeg">
</audio>

<div id="app">
  <div id="start">
    <h1>ALTER DOMUS<br>CYBERSECURITY GRAND PRIX</h1>
    <p>Race Day. Eight teams, one mission — and a threat already moving before the lights go out. Four decisions. Score points for every one you get right, and see your time at the finish line.</p>
    <button class="btn primary" id="start-btn">START THE RACE</button>
  </div>

  <div id="slides"></div>

  <div id="next-zone" class="hidden"></div>
</div>

<div id="music-credit">Music: see assets/audio/README.md for licensing</div>

<script src="js/app.js"></script>
</body>
</html>
